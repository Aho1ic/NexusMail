openapi: 3.1.0
info:
  title: NexusMail API
  version: 0.1.0
  description: Single-user unified mail gateway. Browser clients use a session cookie and CSRF token; external clients use X-API-Key.
servers:
  - url: /
security:
  - apiKey: []
  - sessionCookie: []
paths:
  /api/v1/auth/session:
    post:
      security: []
      summary: Exchange the deployment API key for a browser session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string, minLength: 32 }
      responses:
        '201':
          description: Session created
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrf_token: { type: string }
                  expires_at: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Error' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      summary: End the browser session
      responses:
        '204': { description: Session deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/accounts:
    get:
      summary: List accounts and connection health
      responses:
        '200':
          description: Account list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Account' } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      summary: Add a password account or begin an OAuth flow
      description: >-
        A password provider is created inline and answers 201. An oauth2 provider
        answers 202 with the consent URL instead, and needs a client for that
        provider first: with none stored through
        `PUT /api/v1/oauth/clients/{provider}` and none in the environment the
        call is 400 `oauth_not_configured`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountInput' }
      responses:
        '201':
          description: Password account created
          content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } }
        '202':
          description: OAuth authorization required
          content:
            application/json:
              schema:
                type: object
                properties: { authorization_url: { type: string, format: uri } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/oauth/{provider}/authorize:
    post:
      summary: Start an OAuth flow and return the consent URL to the caller
      description: >-
        Same authorization URL the accounts endpoint hands back in 202, except the
        state is returned with it, so a caller whose callback is unreachable can
        finish through `POST /api/v1/oauth/{provider}/code` instead of waiting for
        the redirect. 400 `oauth_not_configured` means no client is stored for the
        provider and its environment variables are empty too.
      parameters: [ { $ref: '#/components/parameters/Provider' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
      responses:
        '200':
          description: Consent URL and the state that pairs with it
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url, state, redirect_uri]
                properties:
                  authorization_url: { type: string, format: uri }
                  state: { type: string, description: Opaque single-use value to send back with the pasted code }
                  redirect_uri: { type: string, format: uri }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/oauth/{provider}/callback:
    get:
      security: []
      summary: Complete Google or Microsoft OAuth authorization
      description: >
        Always redirects to the SPA, never returns a body: the browser that lands
        here is the consent popup the client is waiting on, and it reads the outcome
        from the query string before closing itself. Success redirects to
        `/?oauth=success`. Every failure redirects to `/?oauth=error&reason=<cause>`,
        where the cause is the provider's own error code, `exchange_failed` when the
        state is unknown or expired or the code exchange fails, or
        `account_rejected` when the address is already connected.
      parameters:
        - { $ref: '#/components/parameters/Provider' }
        - { in: query, name: state, required: true, schema: { type: string } }
        - { in: query, name: code, required: true, schema: { type: string } }
      responses:
        '302': { description: Redirect to the SPA carrying the outcome }
  /api/v1/oauth/{provider}/code:
    post:
      summary: Complete an OAuth flow from a manually pasted authorization code
      description: >-
        Escape hatch for deployments where the callback cannot reach the server:
        the user copies the address bar of the failed redirect and pastes it here.
        `code` takes either the bare authorization code or the whole redirect URL,
        whose query string is parsed server-side. `state` comes from the authorize
        call and is single-use — an expired state, a rejected code or a failed
        exchange all consume it and answer 400, so the client must call authorize
        again for a fresh one. 409 means the address is already connected.
      parameters: [ { $ref: '#/components/parameters/Provider' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, code]
              properties:
                state: { type: string, description: State returned by the authorize call }
                code: { type: string, description: Bare authorization code or the full redirect URL carrying it }
      responses:
        '201':
          description: Account connected
          content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/oauth/clients:
    get:
      summary: List the OAuth client configuration status of every provider
      description: >-
        One entry per OAuth provider in a fixed order. `source` says where the
        credentials in effect come from: a client stored through this API wins over
        the environment variables named in the entry.
      responses:
        '200':
          description: Client status per provider
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/OAuthClientStatus' } }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/oauth/clients/{provider}:
    put:
      summary: Store the OAuth client of a provider
      description: >-
        The secret is encrypted with the master key before it is written and is
        never read back. Takes effect immediately and overrides the provider's
        environment variables until it is deleted.
      parameters: [ { $ref: '#/components/parameters/Provider' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OAuthClientInput' } } }
      responses:
        '200':
          description: Stored client status
          content: { application/json: { schema: { $ref: '#/components/schemas/OAuthClientStatus' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete the stored OAuth client and fall back to the environment
      description: >-
        Idempotent. Afterwards the provider reads its environment variables again
        and reports source none when those are empty too.
      parameters: [ { $ref: '#/components/parameters/Provider' } ]
      responses:
        '204': { description: Stored client deleted }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/accounts/{id}:
    delete:
      summary: Disconnect an account and delete its local mail
      description: >-
        Stops the account's IMAP sync loops and closes its connections first, then
        deletes the account row. Everything stored locally for it — mailboxes,
        messages, attachments and drafts — is removed with it, so this is not a
        pause: reconnecting the same address resyncs from the provider. Mail on the
        provider is never touched.
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses:
        '204': { description: Account disconnected and its local data deleted }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/accounts/{id}/mailboxes:
    get:
      summary: List account mailboxes
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses:
        '200':
          description: Mailboxes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Mailbox' } }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/messages:
    get:
      summary: Query the unified message feed
      parameters:
        - { in: query, name: account_id, schema: { type: integer, format: int64 } }
        - { in: query, name: mailbox_id, schema: { type: integer, format: int64 } }
        - { in: query, name: folder, schema: { type: string } }
        - { in: query, name: is_read, schema: { type: boolean } }
        - { in: query, name: is_starred, description: Only starred (favourited) messages; the starred view spans every account and folder, schema: { type: boolean } }
        - { in: query, name: sender, description: Narrow to one sender mailbox address (case-insensitive substring match on from_json/sender); used by the sender-stack pane, schema: { type: string } }
        - { in: query, name: query, schema: { type: string } }
        - { in: query, name: cursor, schema: { type: string } }
        - in: query
          name: limit
          description: >-
            Page size. Absent, non-numeric or below 1 falls back to 20; anything
            above 100 is clamped to 100 rather than rejected.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Keyset page
          content:
            application/json:
              schema:
                type: object
                required: [items, unread_total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MessageSummary' } }
                  next_cursor: { type: string }
                  unread_total:
                    type: integer
                    description: >-
                      Unread incoming messages in the whole view, not just on this
                      page. Independent of cursor and limit, so it is the count to
                      show in a badge; items alone cannot produce it.
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/messages/mark-read:
    post:
      summary: Mark every unread message in the current view as read
      description: >-
        The view is described with the same account_id/mailbox_id/folder/query
        parameters as the feed, so an active search narrows this call the same way
        it narrows the list. \Seen is set on the provider first and only the
        messages it accepted are written locally, so one bounded pass is applied
        at most; capped reports that more unread mail remains than a single call
        may touch.
      parameters:
        - { in: query, name: account_id, schema: { type: integer, format: int64 } }
        - { in: query, name: mailbox_id, schema: { type: integer, format: int64 } }
        - { in: query, name: folder, schema: { type: string } }
        - { in: query, name: is_starred, schema: { type: boolean } }
        - { in: query, name: query, description: Same full-text term as the feed; restricts the pass to the matching messages, schema: { type: string } }
        - { in: query, name: sender, description: Same sender filter as the feed, schema: { type: string } }
      responses:
        '200':
          description: Number of messages marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
                  capped: { type: boolean, description: More unread mail remains; call again to continue }
                  partial: { type: boolean, description: Some accounts failed; the reported messages were still applied }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/messages/{id}:
    get:
      summary: Read a message; queues body retrieval when necessary
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses:
        '200': { $ref: '#/components/responses/MessageDetail' }
        '202': { $ref: '#/components/responses/MessageDetail' }
        '404': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      summary: Change read/starred state or archive remotely
      description: >-
        At least one of the three fields must be present; an empty body is 400.
        The provider is updated before the local row, so a provider failure leaves
        both unchanged and answers 503 (offline account, or no reachable archive
        mailbox). 404 covers an unknown id and an archive whose message has no
        mapping in the mailbox it is being moved out of. Outgoing rows have no
        mapping by design and are patched locally without contacting the provider.
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_read: { type: boolean }
                is_starred: { type: boolean }
                archive: { type: boolean }
                junk: { type: boolean, description: Move the message to the account's junk/spam mailbox }
      responses:
        '200':
          description: Updated message
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/messages/{id}/calendar:
    get:
      summary: Download/open one message as a calendar event (ICS)
      description: >-
        Serves text/calendar inline so a macOS browser can hand the event to
        Calendar.app with fields pre-filled. Answers 400 when the message has
        no usable date and no received_at.
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses:
        '200':
          description: ICS payload
          content:
            text/calendar:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/messages/{id}/translate:
    post:
      summary: Translate a message body for display
      description: >-
        Requires NEXUSMAIL_TRANSLATE_URL on the gateway. Without it the call is
        400 translate_not_configured. The message row is never rewritten; the
        translation is returned for the client to show beside the original.
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_lang]
              properties:
                target_lang: { type: string, example: zh-CN }
      responses:
        '200':
          description: Translation result
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string }
                  detected_source_lang: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/messages/{id}/attachments/{attachment_id}:
    get:
      summary: Fetch and stream an attachment
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { in: path, name: attachment_id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Attachment bytes
          content: { application/octet-stream: { schema: { type: string, contentEncoding: binary } } }
        '404': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/drafts:
    get:
      summary: List drafts or outbox entries
      parameters:
        - { in: query, name: status, schema: { $ref: '#/components/schemas/DraftStatus' } }
      responses:
        '200':
          description: Drafts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Draft' } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      summary: Create a local draft
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DraftInput' } } }
      responses:
        '201':
          description: Draft created
          content: { application/json: { schema: { $ref: '#/components/schemas/Draft' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/drafts/{id}:
    get:
      summary: Get a draft and its attachments
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses:
        '200':
          description: Draft detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  draft: { $ref: '#/components/schemas/Draft' }
                  attachments: { type: array, items: { $ref: '#/components/schemas/DraftAttachment' } }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      summary: Update a draft using optimistic locking
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { in: header, name: If-Match, required: true, schema: { type: string }, description: Current revision, optionally quoted }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DraftInput' } } }
      responses:
        '200':
          description: Updated draft
          headers: { ETag: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Draft' } } }
        '409': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete a draft
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses:
        '204': { description: Draft deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/drafts/{id}/attachments:
    post:
      summary: Add an attachment to a draft
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      requestBody:
        required: true
        description: >-
          Multipart field `file`. The whole request is bounded by
          NEXUSMAIL_MAX_OUTBOUND_BYTES (default 20 MiB); exceeding it is 400
          `invalid_attachment`.
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary } }
      responses:
        '201':
          description: Attachment created
          content: { application/json: { schema: { $ref: '#/components/schemas/DraftAttachment' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/drafts/{id}/attachments/{attachment_id}:
    delete:
      summary: Remove a draft attachment
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { in: path, name: attachment_id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Attachment removed }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/drafts/{id}/send:
    post:
      summary: Queue a draft for delivery
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses:
        '202': { $ref: '#/components/responses/Queued' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/drafts/{id}/retry:
    post:
      summary: Explicitly retry a failed or unknown delivery
      parameters: [ { $ref: '#/components/parameters/ID' } ]
      responses:
        '202': { $ref: '#/components/responses/Queued' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/ws:
    get:
      summary: Upgrade to the realtime WebSocket stream
      responses:
        '101': { description: WebSocket upgrade }
        '401': { $ref: '#/components/responses/Error' }
  /healthz:
    get:
      security: []
      summary: Process liveness
      responses:
        '200': { description: Process is alive }
  /readyz:
    get:
      security: []
      summary: Database readiness
      responses:
        '200': { description: Ready to serve }
        '503': { description: Database is not ready }

components:
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: X-API-Key }
    sessionCookie: { type: apiKey, in: cookie, name: nexusmail_session }
  parameters:
    ID: { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    Provider: { in: path, name: provider, required: true, schema: { type: string, enum: [gmail, outlook] } }
  responses:
    Error:
      description: Error response
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    MessageDetail:
      description: Message body may still be queued when status is 202
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { $ref: '#/components/schemas/Message' }
              attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
              otp_code:
                type: string
                description: Verification code detected in the subject or body; absent when none was found. Derived on read, never stored.
    Queued:
      description: Accepted for asynchronous delivery
      content:
        application/json:
          schema:
            type: object
            properties:
              id: { type: integer, format: int64 }
              status: { type: string, const: queued }
  schemas:
    AccountInput:
      type: object
      required: [provider]
      properties:
        provider: { type: string, enum: [qq, '163', '126', gmail, outlook, icloud] }
        email: { type: string, format: email }
        display_name: { type: string }
        username: { type: string }
        auth:
          type: object
          properties:
            type: { type: string, enum: [password, oauth2] }
            password: { type: string }
    Account:
      type: object
      required: [id, email, provider, status]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        display_name: { type: string }
        provider: { type: string, enum: [qq, '163', '126', gmail, outlook, icloud] }
        auth_type: { type: string, enum: [password, oauth2] }
        username: { type: string }
        status: { type: string, enum: [disconnected, connecting, syncing, connected, backoff, auth_error, error] }
        last_error: { type: [string, 'null'] }
        last_connected_at: { type: [integer, 'null'], format: int64 }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
    OAuthClientInput:
      type: object
      required: [client_id, client_secret]
      properties:
        client_id: { type: string, minLength: 1 }
        client_secret: { type: string, minLength: 1 }
    OAuthClientStatus:
      type: object
      required: [provider, configured, source, client_id, redirect_uri, env_client_id_key, env_client_secret_key]
      properties:
        provider: { type: string, enum: [gmail, outlook] }
        configured: { type: boolean, description: A usable Client ID and secret are in effect from either source }
        source: { type: string, enum: [database, environment, none], description: none whenever configured is false }
        client_id: { type: string, description: Empty when nothing is configured; client_secret is never returned by any endpoint }
        redirect_uri: { type: string, format: uri, description: Callback to register with the provider }
        env_client_id_key: { type: string, description: Name of the environment variable read for the Client ID }
        env_client_secret_key: { type: string, description: Name of the environment variable read for the secret }
        updated_at: { type: integer, format: int64, description: UTC ms the stored client was last written; present only when source is database }
    Mailbox:
      type: object
      properties:
        id: { type: integer, format: int64 }
        account_id: { type: integer, format: int64 }
        remote_name: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [inbox, sent, drafts, archive, trash, junk, all, custom] }
        sync_mode: { type: string, enum: [realtime, periodic, lazy] }
        uid_validity: { type: integer }
        last_uid: { type: integer }
        last_sync_at: { type: [integer, 'null'], format: int64 }
    MessageSummary:
      type: object
      description: >-
        Feed projection. body_text and body_html are always absent here: a page of
        50 full bodies is megabytes of payload the list never renders. Read a single
        message to get them.
      properties:
        id: { type: integer, format: int64 }
        account_id: { type: integer, format: int64 }
        direction: { type: string, enum: [incoming, outgoing] }
        rfc_message_id: { type: [string, 'null'] }
        subject: { type: string }
        sender: { type: string }
        recipients: { type: string }
        from: { type: string, description: JSON address array }
        to: { type: string, description: JSON address array }
        cc: { type: string, description: JSON address array }
        bcc: { type: string, description: JSON address array }
        snippet: { type: string }
        body_state: { type: string, enum: [metadata, queued, fetching, ready, error] }
        size_bytes: { type: integer, format: int64 }
        received_at: { type: integer, format: int64 }
        is_read: { type: boolean }
        is_starred: { type: boolean }
        has_attachments: { type: boolean }
    Message:
      allOf:
        - $ref: '#/components/schemas/MessageSummary'
        - type: object
          properties:
            body_text: { type: string }
            body_html: { type: string, description: Server-sanitized HTML }
    Attachment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        message_id: { type: integer, format: int64 }
        part_id: { type: string }
        filename: { type: string }
        content_type: { type: string }
        content_id: { type: [string, 'null'], description: 'RFC 2392 Content-ID with angle brackets, e.g. <img001@example>; present on inline parts and absent otherwise. Clients resolve cid: URLs in body_html against it.' }
        size_bytes: { type: integer, format: int64 }
        fetch_state: { type: string, enum: [metadata, fetching, ready, error] }
    DraftStatus:
      type: string
      enum: [draft, queued, sending, retry_wait, failed, unknown, sent]
    DraftInput:
      type: object
      required: [account_id]
      properties:
        account_id: { type: integer, format: int64 }
        source_message_id: { type: [integer, 'null'], format: int64 }
        to: { type: array, items: { type: string, format: email } }
        cc: { type: array, items: { type: string, format: email } }
        bcc: { type: array, items: { type: string, format: email } }
        subject: { type: string }
        body_text: { type: string }
    Draft:
      type: object
      properties:
        id: { type: integer, format: int64 }
        account_id: { type: integer, format: int64 }
        conflict_of_id:
          type: [integer, 'null']
          format: int64
          description: >-
            Set on a conflict copy: the id of the local draft this was split from
            when a remote edit collided with an unsynced local one. Absent on
            ordinary drafts; a copy carries remote_sync_state conflict.
        rfc_message_id: { type: string }
        revision: { type: integer, format: int64 }
        to: { type: string, description: JSON address array }
        cc: { type: string, description: JSON address array }
        bcc: { type: string, description: JSON address array }
        subject: { type: string }
        body_text: { type: string }
        status: { $ref: '#/components/schemas/DraftStatus' }
        remote_sync_state: { type: string, enum: [dirty, syncing, synced, error, conflict] }
        attempt_count: { type: integer }
        last_error: { type: [string, 'null'] }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
    DraftAttachment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        draft_id: { type: integer, format: int64 }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        position: { type: integer }
    Event:
      type: object
      required: [type, sequence, occurred_at, data]
      properties:
        type: { type: string, enum: [NEW_EMAIL, MESSAGE_UPDATED, ACCOUNT_STATUS, DRAFT_UPDATED, OUTBOX_UPDATED] }
        sequence: { type: integer, format: int64 }
        occurred_at: { type: integer, format: int64 }
        data:
          type: object
          additionalProperties: true
          description: >-
            NEW_EMAIL and MESSAGE_UPDATED carry otp_code and otp_subject when a
            verification code was detected in a message received within the last
            ten minutes. MESSAGE_UPDATED from a bulk mark-read carries bulk and
            count instead of message_id.
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            details: {}
