name: Publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: nexusmail

jobs:
  # Resolved once and shared: both build legs need the same version string, and
  # deciding it per-leg would risk the two architectures disagreeing.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
      build: ${{ steps.version.outputs.build }}
      release: ${{ steps.version.outputs.release }}
      owner: ${{ steps.version.outputs.owner }}
      images: ${{ steps.registries.outputs.images }}
      dockerhub: ${{ steps.registries.outputs.dockerhub }}
    steps:
      - name: Check out repository
        # Full history: the VERSION diff is taken against the pushed-from commit,
        # which can be arbitrarily far back when a push carries several commits.
        # A shallow clone simply would not contain it, and the diff would fail.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and release status
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION must contain a semantic version, got: $version" >&2
            exit 1
          fi

          # A release is a push that actually changed VERSION, or any manual run.
          # Every other push still publishes, but only under a commit-SHA tag, so
          # a semantic tag keeps pointing at the single build that claimed it.
          release=false
          if [[ "${{ github.event_name }}" != "push" ]]; then
            release=true
          else
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
              before="HEAD^"
            fi
            # git diff exits 0 for "same", 1 for "differs" and 128 when the ref is
            # unusable — after a force-push, say. Those are separated deliberately:
            # treating an unusable ref as a change would republish a semantic tag
            # over an existing one, whereas skipping it only omits a tag that a
            # manual run can still add.
            set +e
            git diff --quiet "$before" HEAD -- VERSION
            diff_status=$?
            set -e
            case "$diff_status" in
              0) ;;
              1) release=true ;;
              *) echo "::warning::Could not diff VERSION against ${before}; publishing without a semantic tag." ;;
            esac
          fi

          # The build that goes into a non-release image is labelled with the commit
          # it came from, so the version in the startup log identifies it exactly.
          build_version="$version"
          if [[ "$release" != "true" ]]; then
            build_version="${version}-${GITHUB_SHA::7}"
          fi

          {
            # Registry paths must be lowercase; this owner login is not.
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
            echo "value=$version"
            echo "build=$build_version"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $build_version (release=$release)"

      - name: Resolve target registries
        id: registries
        shell: bash
        env:
          # The username is a repository variable, not a secret. As a secret it
          # would be masked, and Actions refuses to pass a job output that contains
          # a secret value across jobs — the image list arrived empty in the build
          # job, which failed with "tag is needed when pushing to registry".
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GHCR needs no configuration beyond the built-in token. Docker Hub is
          # opt-in: without the variable and the secret its steps are skipped rather
          # than failing the run, so a missing credential cannot cost the GHCR image.
          images="ghcr.io/${{ steps.version.outputs.owner }}/${IMAGE_NAME}"
          dockerhub=false
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            dockerhub=true
            images="${images},docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          else
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set — publishing to GHCR only."
          fi
          echo "dockerhub=$dockerhub" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  # One leg per architecture on its own native runner. The alternative — a single
  # job building both under QEMU — emulates the CGO/static Go build, and this
  # workflow now runs on every push, so the emulation penalty would be paid every
  # time. arm64 runners are free on public repositories.
  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.prepare.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Pushed by digest only: tags belong to the manifest list the merge job
          # assembles, and a per-leg tag would leave whichever leg finished last
          # masquerading as the multi-arch image.
          outputs: type=image,"name=${{ needs.prepare.outputs.images }}",push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.prepare.outputs.build }}
          # Cache is scoped per architecture; sharing one key would make the two
          # legs evict each other on every run.
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          # The filename carries the digest; the merge job only needs the set of
          # them, and matrix job outputs would overwrite one another.
          touch "/tmp/digests/${{ matrix.slug }}-${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The tags are created here, once, over both per-architecture digests. Until this
  # job runs, the pushed images are reachable only by digest and no tag has moved.
  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.prepare.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.images }}
          tags: |
            type=sha,format=short
            type=raw,value=${{ needs.prepare.outputs.value }},enable=${{ needs.prepare.outputs.release }}
            type=raw,value=v${{ needs.prepare.outputs.value }},enable=${{ needs.prepare.outputs.release }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.build }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Create manifest lists and push
        shell: bash
        env:
          IMAGES: ${{ needs.prepare.outputs.images }}
        run: |
          set -euo pipefail
          digests=()
          for file in /tmp/digests/*; do
            # The digest is the part after the architecture prefix in the filename.
            digests+=("sha256:${file##*/*-}")
          done
          if [[ ${#digests[@]} -eq 0 ]]; then
            echo "No digests were produced by the build legs." >&2
            exit 1
          fi
          echo "Merging ${#digests[@]} digest(s): ${digests[*]}"

          # One manifest list per repository. Each repository already holds both
          # architectures' blobs, so its own digests are used as the sources —
          # imagetools would otherwise copy them across registries needlessly.
          IFS=',' read -r -a repositories <<< "$IMAGES"
          for repository in "${repositories[@]}"; do
            tags=()
            while IFS= read -r tag; do
              [[ -n "$tag" ]] && tags+=("-t" "$tag")
            done < <(jq -r --arg repo "$repository" '.tags[] | select(startswith($repo + ":"))' <<< "$DOCKER_METADATA_OUTPUT_JSON")
            if [[ ${#tags[@]} -eq 0 ]]; then
              echo "::warning::No tags resolved for ${repository}; skipping."
              continue
            fi
            sources=()
            for digest in "${digests[@]}"; do
              sources+=("${repository}@${digest}")
            done
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          done

      - name: Verify and summarise
        shell: bash
        env:
          IMAGES: ${{ needs.prepare.outputs.images }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a repositories <<< "$IMAGES"
          {
            echo "### Published"
            echo
            echo "Version \`${{ needs.prepare.outputs.build }}\` (release: ${{ needs.prepare.outputs.release }})"
            echo
            echo '```'
            jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"
            echo '```'
            echo
            echo "#### Architectures"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # An image that silently lost an architecture is the failure this whole
          # structure exists to avoid, so the manifest is read back and asserted.
          for repository in "${repositories[@]}"; do
            platforms="$(docker buildx imagetools inspect "${repository}:latest" --raw \
              | jq -r '[.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"] | sort | join(", ")')"
            echo "- \`${repository}\`: ${platforms}" >> "$GITHUB_STEP_SUMMARY"
            for required in linux/amd64 linux/arm64; do
              if [[ "$platforms" != *"$required"* ]]; then
                echo "${repository}:latest is missing ${required} (has: ${platforms})" >&2
                exit 1
              fi
            done
          done
